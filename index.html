<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111010">
<meta name="description" content="Our Love Archive">
<title>Our Love Archive ♡</title>
<style>
  :root {
    --bg: #0f0d0e;
    --card: #191516;
    --text: #fff5f2;
    --muted: #cdbab7;
    --line: #493a3c;
    --pink: #e6a1b4;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top))
             max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(20px, env(safe-area-inset-left));
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 50% 15%, #2a1b20 0, transparent 38%),
      var(--bg);
    color: var(--text);
  }
  .card {
    width: min(100%, 420px);
    padding: clamp(30px, 8vw, 48px) clamp(22px, 7vw, 34px);
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: rgba(25, 21, 22, .94);
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
  }
  .heart { font-size: clamp(32px, 10vw, 42px); margin-bottom: 8px; }
  h1 {
    margin: 0;
    font-size: clamp(28px, 8vw, 38px);
    line-height: 1.15;
    font-weight: 500;
  }
  .subtitle {
    margin: 14px auto 28px;
    max-width: 320px;
    color: var(--muted);
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 1.65;
  }
  input {
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    border: 1px solid #675355;
    border-radius: 14px;
    background: #0c0a0b;
    color: white;
    text-align: center;
    font-size: 20px;
    letter-spacing: 4px;
    outline: none;
  }
  input:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(230,161,180,.12);
  }
  button {
    width: 100%;
    min-height: 54px;
    margin-top: 13px;
    padding: 14px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--pink);
    color: #24181c;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .footer {
    margin-top: 25px;
    color: #8e7d7b;
    font-size: 12px;
    letter-spacing: .5px;
  }

  /* Popup */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0,0,0,.72);
    backdrop-filter: blur(5px);
  }
  .overlay.show { display: flex; }
  .popup {
    width: min(100%, 340px);
    padding: 30px 24px 24px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: #1b1718;
    box-shadow: 0 25px 80px rgba(0,0,0,.55);
    animation: pop .22s ease-out;
  }
  .popup-icon { font-size: 34px; margin-bottom: 8px; }
  .popup h2 {
    margin: 0 0 9px;
    font-size: 25px;
    font-weight: 500;
  }
  .popup p {
    margin: 0 0 20px;
    color: var(--muted);
    line-height: 1.5;
    font-size: 15px;
  }
  .popup button {
    margin: 0;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.92); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<main class="card">
  <div class="heart">♡</div>
  <h1>Our Love Archive</h1>
  <p class="subtitle">
    A little place for our memories.<br>
    Enter our secret PIN to continue.
  </p>

  <form id="form">
    <input id="pin" type="password" inputmode="numeric"
           autocomplete="off" maxlength="8"
           placeholder="••••••••" aria-label="Secret PIN">
    <button type="submit">Open Our Memories ♡</button>
  </form>

  <div class="footer">our little secret ♡</div>
</main>

<!-- Popup -->
<div class="overlay" id="overlay">
  <div class="popup" role="dialog" aria-modal="true">
    <div class="popup-icon" id="popupIcon">♡</div>
    <h2 id="popupTitle"></h2>
    <p id="popupText"></p>
    <button id="popupButton">OK ♡</button>
  </div>
</div>

<script>
  const CORRECT_PIN = "10202024";
  const GOOGLE_DRIVE_URL =
    "https://drive.google.com/drive/folders/1950DYGzSosrifjxNpmak06wTwM9ZXjZe";

  const form = document.getElementById("form");
  const pin = document.getElementById("pin");
  const overlay = document.getElementById("overlay");
  const popupIcon = document.getElementById("popupIcon");
  const popupTitle = document.getElementById("popupTitle");
  const popupText = document.getElementById("popupText");
  const popupButton = document.getElementById("popupButton");

  let correctPassword = false;

  function showPopup(icon, title, text, isCorrect) {
    correctPassword = isCorrect;
    popupIcon.textContent = icon;
    popupTitle.textContent = title;
    popupText.textContent = text;
    popupButton.textContent = isCorrect ? "Open Our Memories ♡" : "Try Again";
    overlay.classList.add("show");
  }

  function closePopup() {
    overlay.classList.remove("show");

    if (correctPassword) {
      // Same browser tab: replace the current page with Google Drive.
      window.location.replace(GOOGLE_DRIVE_URL);
    } else {
      pin.value = "";
      pin.focus();
    }
  }

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    if (pin.value === CORRECT_PIN) {
      showPopup(
        "💕",
        "I love you, lovie",
        "Thank you for being part of my favorite memories. ♡",
        true
      );
    } else {
      showPopup(
        "🔐",
        "Wrong password",
        "That's not our secret ♡",
        false
      );
    }
  });

  popupButton.addEventListener("click", closePopup);

  overlay.addEventListener("click", function(event) {
    if (event.target === overlay) closePopup();
  });
</script>
</body>
</html>
