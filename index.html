<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111010">
<meta name="description" content="Our Love Archive">
<title>Our Love Archive ♡</title>
<style>
  :root {
    --bg: #0f0d0e;
    --card: #191516;
    --text: #fff5f2;
    --muted: #cdbab7;
    --line: #493a3c;
    --pink: #e6a1b4;
    --pink-dark: #3b252c;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top))
             max(20px, env(safe-area-inset-right))
             max(20px, env(safe-area-inset-bottom))
             max(20px, env(safe-area-inset-left));
    font-family: Georgia, "Times New Roman", serif;
    background:
      radial-gradient(circle at 50% 15%, #2a1b20 0, transparent 38%),
      var(--bg);
    color: var(--text);
  }
  .card {
    width: min(100%, 420px);
    padding: clamp(30px, 8vw, 48px) clamp(22px, 7vw, 34px);
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 26px;
    background: rgba(25, 21, 22, .94);
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
  }
  .heart {
    font-size: clamp(32px, 10vw, 42px);
    margin-bottom: 8px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 8vw, 38px);
    line-height: 1.15;
    font-weight: 500;
  }
  .subtitle {
    margin: 14px auto 28px;
    max-width: 320px;
    color: var(--muted);
    font-size: clamp(15px, 4.2vw, 17px);
    line-height: 1.65;
  }
  input {
    width: 100%;
    min-height: 54px;
    padding: 14px 16px;
    border: 1px solid #675355;
    border-radius: 14px;
    background: #0c0a0b;
    color: white;
    text-align: center;
    font-size: 20px;
    letter-spacing: 4px;
    outline: none;
    -webkit-appearance: none;
  }
  input:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(230,161,180,.12);
  }
  button {
    width: 100%;
    min-height: 54px;
    margin-top: 13px;
    padding: 14px 16px;
    border: 0;
    border-radius: 14px;
    background: var(--pink);
    color: #24181c;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.99); }
  .message {
    min-height: 27px;
    margin-top: 14px;
    color: var(--pink);
    font-size: 17px;
    line-height: 1.4;
  }
  .footer {
    margin-top: 25px;
    color: #8e7d7b;
    font-size: 12px;
    letter-spacing: .5px;
  }
  .hidden { display: none; }
  .love-message {
    animation: fade .7s ease;
  }
  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 360px) {
    .card { border-radius: 20px; }
    .subtitle { margin-bottom: 22px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="heart">♡</div>
  <h1>Our Love Archive</h1>

  <p class="subtitle">
    A little place for our memories.<br>
    Enter our secret PIN to continue.
  </p>

  <form id="form">
    <input id="pin"
           type="password"
           inputmode="numeric"
           autocomplete="off"
           maxlength="8"
           placeholder="••••••••"
           aria-label="Secret PIN">
    <button type="submit">Open Our Memories ♡</button>
  </form>

  <div id="message" class="message" aria-live="polite"></div>

  <div class="footer">our little secret ♡</div>
</main>

<script>
  const CORRECT_PIN = "10202024";
  const GOOGLE_DRIVE_URL =
    "https://drive.google.com/drive/folders/1950DYGzSosrifjxNpmak06wTwM9ZXjZe";

  document.getElementById("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const pin = document.getElementById("pin").value;
    const message = document.getElementById("message");

    if (pin === CORRECT_PIN) {
      message.textContent = "I love you, lovie ♡";
      message.classList.add("love-message");

      // Open the Drive folder in the same browser tab after the message appears.
      setTimeout(function() {
        window.location.href = GOOGLE_DRIVE_URL;
      }, 1300);
    } else {
      message.textContent = "That's not our secret ♡";
      document.getElementById("pin").select();
    }
  });
</script>
</body>
</html>
